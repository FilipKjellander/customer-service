name: Customer CI Actions

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - run: mvn -B package
      - name: login-docker-hub
        run: echo ${{secrets.DOCKER_HUB_TOKEN}} | docker login -u ${{secrets.DOCKER_USER}} --password-stdin
      - name: build-image
        run: |
          docker build -t ${{secrets.DOCKER_USER}}/customer-service:${{github.run_number}} .
      - name: push-to-docker-hub
        run: |
          docker push ${{secrets.DOCKER_USER}}/customer-service:${{github.run_number}}

      
